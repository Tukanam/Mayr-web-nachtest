<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Geografie</title>
  <style>
    body {
      background-color: lightblue;
    }
  </style>
</head>
<body>

  <h1>Alois Mayr - 5r</h1>

  <h2>Geografische Fakten</h2>

  <p>Die Traumstadt: Bracelona</p>
  <p>Einwohnerzahl: 1,73</p>

  <h2>Top 3 Sehenswürdigkeiten</h2>

  <ol>
    <li>Sagrada Família</li>
    <li>Park Güell</li>
    <li>La Rambla</li>
  </ol>

  <h2>Kulinarische Spezialitäten</h2>

  <ul id="liste-essen"></ul>

  <h2>Visueller Eindruck</h2>
  
  <script>
    const essen = ["Wiener Schnitzel", "Kaiserschmarrn", "Tafelspitz", "Österreich"];
    const liste = document.getElementById("liste-essen");
    essen.forEach(h => {
      let li = document.createElement("li");
      li.textContent = h;
      liste.appendChild(li);
    });
  </script>
  
</body>
</html>
