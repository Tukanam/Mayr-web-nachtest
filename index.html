<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Geografie</title>
  <style>
    body {
      background-color: lightblue;
    }
  </style>
</head>
<body>

  <h1>Alois Mayr - 5r</h1>

  <h2>Geografische Fakten</h2>

  <p>Die Traumstadt: Barcelona</p>
  <p>Einwohnerzahl: 1,73 Mil.</p>

  <h2>Top 3 Sehenswürdigkeiten</h2>

  <ol>
    <li>Sagrada Família</li>
    <li>Park Güell</li>
    <li>La Rambla</li>
  </ol>

  <h2>Kulinarische Spezialitäten</h2>

  <ul id="liste-essen"></ul>

  <h2>Visueller Eindruck</h2>

  <figure>
    <img
      src="img/wahrzeichen.jpg 
      width="450"
      title="Vorgegebenes Bild"
      alt="Nordturm des Stephansdoms in Wien, Österreich – ein gotischer Kirchturm mit verzierten Steinarbeiten vor blauem Himmel."
    >
    <figcaption>
      <a href="https://commons.wikimedia.org/wiki/File:Stephansdom_Nordturm_01.JPG">Stephansdom Nordturm 01.JPG</a>,
      <a href="https://commons.wikimedia.org/wiki/User:Uoaei1">Uoaei1</a>,
      <a href="https://creativecommons.org/licenses/by-sa/3.0">Creative Commons Attribution-Share Alike 3.0</a>.
    </figcaption>
  </figure>

  <script>
    const essen = ["Wiener Schnitzel", "Kaiserschmarrn", "Tafelspitz", "Österreich"];
    const liste = document.getElementById("liste-essen");
    essen.forEach(h => {
      let li = document.createElement("li");
      li.textContent = h;
      liste.appendChild(li);
    });
  </script>

</body>
</html>
